name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm -r lint

      - name: Run TypeScript type check
        run: pnpm -r typecheck

      - name: Build application
        run: pnpm -r build
        env:
          # Mock environment variables for build
          NEXT_PUBLIC_SITE_NAME: EverVibe Studios
          NEXT_PUBLIC_SITE_URL: https://evervibestudios.com
          NEXT_PUBLIC_CONTACT_EMAIL: info@evervibestudios.com
          CMS_BASE_URL: https://cms.evervibestudios.com
