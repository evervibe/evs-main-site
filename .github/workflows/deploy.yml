name: Deploy

on:
  push:
    branches: 
      - main
      - 'copilot/**'
      - 'agent/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: true

      - name: Run TypeScript type check
        run: pnpm typecheck

      - name: Build application
        run: pnpm build
        env:
          # Build-time environment variables
          NEXT_PUBLIC_SITE_NAME: EverVibe Studios
          NEXT_PUBLIC_SITE_URL: https://evervibestudios.com
          NEXT_PUBLIC_CONTACT_EMAIL: info@evervibestudios.com
          CMS_BASE_URL: https://cms.evervibestudios.com
          CMS_API_TOKEN: ${{ secrets.CMS_API_TOKEN }}
          CMS_PREVIEW_SECRET: ${{ secrets.CMS_PREVIEW_SECRET }}
          CORE_HEALTH_URL: ${{ secrets.CORE_HEALTH_URL }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          echo "Deployment handled by Vercel GitHub integration"
          echo "Waiting for deployment to complete..."
          sleep 30

      - name: Verify deployment health
        run: |
          echo "Checking main site health..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://evervibestudios.com/api/health || echo "000")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "Health endpoint response: $HTTP_CODE"
          echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passed"
          else
            echo "⚠️  Health check returned status $HTTP_CODE"
            exit 1
          fi

      - name: Verify Core connectivity (if configured)
        if: ${{ secrets.CORE_HEALTH_URL != '' }}
        run: |
          echo "Checking Core health via main site..."
          RESPONSE=$(curl -s https://evervibestudios.com/api/health || echo "{}")
          echo "$RESPONSE" | jq '.core' 2>/dev/null || echo "Core health data not available"

      - name: Summary
        if: success()
        run: |
          echo "🚀 Deployment successful!"
          echo "📊 Version: 1.7.0"
          echo "🏷️  Template Version: 1.7.0"
          echo "🔧 Core Version: 0.4.1"
          echo "🌐 URL: https://evervibestudios.com"
          echo "✅ Health check: Passed"
